version: 2
models:
  - name: dim_customers
    description: "One row per unique customer, surrogate key generated by dbt."
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: customer_name
        tests:
          - unique
          - not_null

  - name: dim_products
    description: "One row per unique product, surrogate key generated by dbt."
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
      - name: product_name
        tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 'MECHANICAL KEYBOARD'
                  - 'LAPTOP STAND'
                  - 'DESK LAMP'
                  - 'USB-C HUB'
                  - 'PORTABLE SSD'
                  - 'WEBCAM'
                  - 'SMARTWATCH'
                  - 'WIRELESS MOUSE'
                  - 'NOISE-CANCELLING HEADPHONES'
                  - 'BLUETOOTH SPEAKER'

  - name: fct_orders
    description: "One row per order, linked to dim_customers and dim_products."
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id

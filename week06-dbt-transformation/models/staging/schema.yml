version: 2
models:
  - name: stg_orders
    description: "Selected raw order columns, pulled directly from the source table with no business logic applied yet."
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_name
        tests:
          - not_null
      - name: product_name
        tests:
          - not_null
      - name: quantity
        tests:
          - not_null
      - name: total_amount
        tests:
          - not_null

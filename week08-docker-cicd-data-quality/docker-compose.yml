services:
  pipeline:
    build: .
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pipeline_user
      POSTGRES_PASSWORD: pipeline_pass
      POSTGRES_DB: pipeline_db
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: